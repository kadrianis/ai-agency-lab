name: Repository privacy checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  support-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - run: npm test
      - run: npm run evaluate
      - name: Build and smoke test container
        shell: bash
        run: |
          set -euo pipefail
          docker build -f agency/Dockerfile -t support-triage:ci .
          export API_TOKEN="$(openssl rand -hex 32)"
          docker run -d --name support-triage-ci -p 127.0.0.1:7860:7860 -e API_TOKEN support-triage:ci
          trap 'docker rm -f support-triage-ci >/dev/null' EXIT
          curl --retry 12 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:7860/health
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7860/intake -H 'Content-Type: application/json' --data-binary @agency/automations/intake/sample.json)" = '401'
          for expected in 201 200; do
            code=$(curl -s -o /tmp/triage-result.json -w '%{http_code}' http://127.0.0.1:7860/intake -H "Authorization: Bearer $API_TOKEN" -H 'Content-Type: application/json' --data-binary @agency/automations/intake/sample.json)
            test "$code" = "$expected"
            node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/triage-result.json')); if(r.result.queue!=='billing'||r.duplicate!==($expected===200)) process.exit(1)"
          done
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reject local administration files
        shell: python
        run: |
          import pathlib, re, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          blocked = re.compile(r'(^|/)(\.local|reports|receipts|mail-ledger|lab-runs)(/|$)|(^|/)factory\.config\.json$|^docs/(OPERATIONS|ORGANISATION[^/]*|EXECUTIONS-SEPAREES|PROGRAMME-21-JOURS)\.md$')
          violations = [name for name in files if name and blocked.search(name)]
          for name in files:
              if name and pathlib.Path(name).suffix.lower() in ('.md', '.json', '.txt'):
                  text = pathlib.Path(name).read_text(encoding='utf-8')
                  if re.search(r'[A-Za-z]:[/\\]Users[/\\]|[\w.+-]+@(gmail|outlook|hotmail)\.com', text, re.I):
                      violations.append(name)
          if violations:
              raise SystemExit('Private administration content must stay local: ' + ', '.join(sorted(set(violations))))
          print('No local administration files or personal account details detected.')
