name: Factory quality and daily audit
on:
  push:
    branches: [main]
    paths-ignore: ['reports/**', 'receipts/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
      timezone: Europe/Paris
permissions:
  contents: read
concurrency:
  group: factory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --test tests/*.test.mjs
  audit:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node scripts/audit.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Persist evidence, without implying products were deployed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports
          if ! git diff --cached --quiet; then
            git commit -m 'chore: daily publication evidence audit'
            git push
          fi
      - name: Run summary
        run: cat reports/*.md >> "$GITHUB_STEP_SUMMARY"
